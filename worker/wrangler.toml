name = "plantcare-sync"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One Durable Object per household: it stores the encrypted blob, tells connected phones when it changes
# (WebSocket) and wakes sleeping phones with a push at the reminder times.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# Photos. Files are encrypted on the phone before upload; the bucket only ever holds ciphertext.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "plantcare-photos"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Vault"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[vars]
# OAuth client ID from Google Cloud (public, not a secret). Tokens issued for any other client are refused.
# It is the same one Savings Tracker uses: Google only checks the site (https://ivantuer.github.io), not the path.
GOOGLE_CLIENT_ID = "48421767098-s12lbcksebhdo5hiano0u26edjugif7k.apps.googleusercontent.com"
# Comma-separated list of sites allowed to call this server (localhost is always allowed).
ORIGINS = "https://ivantuer.github.io"
# Public push key printed by `npm run vapid` in the app folder. The private half is a secret (see README).
VAPID_PUBLIC = "BIkVRZ2s7GgcJ1oghgSNzb6s8MtGZmKfpoSZA6IPV4yrdicdgrmzVF-0sWnumP6C20qyHZGoNhKTaWLyT4V2ixU"
# A contact the push services can reach if your server misbehaves. Replace with your own address.
VAPID_SUBJECT = "mailto:you@example.com"
